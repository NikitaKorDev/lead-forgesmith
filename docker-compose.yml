services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: forgesmith
      POSTGRES_PASSWORD: forgesmith
      POSTGRES_DB: forgesmith
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgesmith -d forgesmith"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:

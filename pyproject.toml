[project]
name = "forgesmith"
version = "0.1.0"
description = "Self-hosted B2B lead research and outreach-operations pipeline"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Nikita Korshunov" }]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20",
    "asyncpg>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "rich>=13.7",
    "structlog>=24.1",
    "playwright>=1.64.0",
    "tzdata>=2024.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.17.1",
]

[project.optional-dependencies]
# Desktop console. Optional so the pipeline stays headless by default:
#   uv sync --extra gui && uv run forgesmith-gui
gui = [
    "PyQt5>=5.15.11",
    # Riverbank ships no Windows Qt binaries after 5.15.2, and the resolver
    # otherwise picks a manylinux-only PyQt5-Qt5 and fails on win_amd64.
    "PyQt5-Qt5==5.15.2; sys_platform == 'win32'",
]
# Bulk POI/register extracts (Overture places). Optional because it is a
# 15 MB analytical engine that only the local-extract sources need:
#   uv sync --extra sources
sources = [
    "duckdb>=1.1",
]

[project.scripts]
forgesmith = "forgesmith.cli:app"
forgesmith-gui = "forgesmith.gui:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forgesmith"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
# The phase plan is documentation and must not be reformatted by the linter.
extend-exclude = ["phase2.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
ignore = ["B008", "RUF001", "RUF002", "RUF003", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
"src/forgesmith/cli.py" = ["B006"]
